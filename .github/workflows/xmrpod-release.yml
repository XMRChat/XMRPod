name: XMRPod Release

on:
  push:
    branches:
      - develop
    tags:
      - "xmrpod-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release from changelog
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare changelog metadata and tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 scripts/update_changelog_release.py --latest --print-version)"
          release_tag="xmrpod-v$version"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "$release_tag already exists; skipping release."
            exit 0
          fi

          git tag -a "$release_tag" -m "XMRPod $version"
          git push origin "$release_tag"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish APK
    needs: prepare
    if: always() && (startsWith(github.ref, 'refs/tags/xmrpod-v') || needs.prepare.outputs.should_release == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystore
          cp app/keystore app-wearos/keystore
          {
            echo "releaseStoreFile=keystore"
            echo "releaseStorePassword=$KEYSTORE_PASSWORD"
            echo "releaseKeyAlias=$KEY_ALIAS"
            echo "releaseKeyPassword=$KEY_PASSWORD"
          } >> gradle.properties

      - name: Build Free release APK
        run: ./gradlew assembleFreeRelease

      - name: Verify and rename APK
        run: |
          version="${RELEASE_TAG#xmrpod-v}"
          release_apk="$(find app/build/outputs/apk/free/release -name '*.apk' -print -quit)"
          test -n "$release_apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$release_apk"
          cp "$release_apk" "/tmp/xmrpod-$version.apk"

      - name: Prepare release notes
        run: |
          version="${RELEASE_TAG#xmrpod-v}"
          python3 scripts/update_changelog_release.py \
            --version "$version" \
            --release-notes /tmp/xmrpod-release-notes.md \
            --full-changelog-url "https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_TAG/CHANGELOG.md"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#xmrpod-v}"
          gh release create "$RELEASE_TAG" \
            "/tmp/xmrpod-$version.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "XMRPod $version" \
            --notes-file /tmp/xmrpod-release-notes.md
